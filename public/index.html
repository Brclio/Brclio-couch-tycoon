<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101c38">
  <title>客厅大富翁 · 在线桌游</title>
  <link rel="stylesheet" href="/home.css">
</head>
<body>
  <header class="home-nav">
    <a href="/" class="wordmark"><img src="/avatars/1f4b0.webp" alt="">客厅大富翁</a>
    <nav aria-label="玩法"><a href="/local">同屏轮流玩</a><a href="/online">账号大厅</a></nav>
  </header>
  <main class="home">
    <section class="welcome">
      <h1>客厅<span>大富翁</span></h1>
      <p class="intro">和好友掷骰环游世界，买下国家，盖起酒店。<br>每人打开网页即可入座。</p>
      <dl class="specs"><div><dt>玩家</dt><dd>2–6 人</dd></div><div><dt>棋盘</dt><dd>68 格</dd></div><div><dt>好友局</dt><dd>60 分钟</dd></div></dl>
      <div class="home-actions">
        <button class="create" id="create">创建好友房间 <span aria-hidden="true">↗</span></button>
        <form id="join"><label for="code">加入朋友的房间</label><div><input id="code" maxlength="4" placeholder="4 位房间码" autocomplete="off" autocapitalize="characters" spellcheck="false" required><button>加入</button></div></form>
        <a id="resume" hidden></a><p id="message" role="status"></p>
      </div>
    </section>
    <div class="preview" aria-hidden="true"><div id="miniBoard" class="mini-board"><div class="mini-center">
      <div class="travel"><img src="/avatars/1f43c.webp" alt=""><img src="/avatars/1f436.webp" alt=""></div>
      <div class="mini-dice"><b>⚄</b><b>⚂</b></div>
    </div></div></div>
  </main>
  <footer><span>客厅大富翁</span><a href="/online">公开桌与账号登录 ↗</a></footer>
  <script type="module" src="/home.js"></script>
</body>
</html>
